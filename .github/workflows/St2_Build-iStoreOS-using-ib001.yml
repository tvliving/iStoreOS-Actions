#同一时间只允许一个实例，避免定时任务叠加
concurrency:
  group: istoreos-daily-build
  cancel-in-progress: false

env:
  VERSION: 25.12.6
  #Release 标签前缀，最终标签形如 iStoreOS-2026-11-02
  RELEASE_PREFIX: iStoreOS

jobs:
  #定时触发：全部机型分组并行编译
  build-all:
    if: github.event_name != 'workflow_dispatch' || inputs.openwrt_board == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        #232 台机型分成 10 组，每组一个独立 job（单个 job 编全部机型会超过 6 小时上限）
        GROUP:
          - "a311d-oes_s922x-oes-plus_wxy-oect_nsy-g16-plus_nsy-g68-plus_bdy-g18-pro_bdy-g98_s905d_s905x3_s912_s922x-ct2000_a311d_alark35-3500_anas3035_aio-3399b_aio-3399c_aio-3399c-ai_bdkj-bd-one_beikeyun_boca-tcn100_boca-tcn200_bt-100m_bt-1000m_cd1000"
          - "chainedbox_cm3588-nas_crrc_dc-a588_dg3399_dg-nas-lite_dg-tn3568_dlfr100_e20c_e25_eaidk-610_easepi-a2_easepi-r2_elfboard-elf2_emb3531_fine3399_firefly-itx-3588j_firefly-jd4_firefly-rk3399_fmx1-pro_fmx1-pro-b_gea-6319_gzpeite-p01_h28k"
          - "h339pc_h618-ai-douhe_h618-devboard_h66k_h68k_h69k_h88k_h88k-v3_h96-max-m2_hk1-rbox-k8s_houzzkit-f1_hs530r_ht2_hugsun-x99_indiedroid-nova_ipc-r_jp-tvbox_king3399_kylin3399_lckfb-tspi_lckfb-tspi-3m_leez_lubancat-1_lubancat-2"
          - "lubancat-3_lubancat-4_lubancat-5_lx-r3s_lyt-t68m_lz-d3568_lz-d3588_lz-k3568_md1000_mrkaio-m68s_nanopc-t4_nanopc-t6_nanopi-m5_nanopi-r5c_nanopi-r5s_nanopi-som_orangepi-3b_orangepi-5-plus_orangepi-5-pro_orangepi-5-ultra_orangepi-5b_orangepi-zero3_painet-p3_painet-p5"
          - "panther-x2_photonicat_quarkpi-ca2_r66s_r68s_recomputer-rk3576-devkit_renegade-rk3328_rk3318-box_roceos-k40pro_rock-5-itx_rock-3b_rock-3c_rock5b_rock5c_ruisen-box_s905_s905-beelink-mini_s905-mxqpro-plus_s905d-ki-pro_s905d-sml5442tw_s905d3-khadas-vim3l_s905l_s905l-aurora-1s_s905l-b860av21u"
          - "s905l-mg101_s905l2_s905l2-e900v21e_s905l2-wojia_s905l3_s905l3-cm211_s905l3-unt400g1_s905l3-unt402a_s905l3a_s905l3a-cm311_s905l3a-m401a_s905l3a-w103d_s905l3b_s905l3b-e900v21d_s905l3b-e900v22d_s905l3b-e900v22e_s905l3b-ip103h_s905l3b-m302a_s905l3b-rg020et-ca_s905l3b-unt403a_s905lb-ipbs9505_s905lb-q96-mini_s905lb-r3300l_s905mb"
          - "s905w_s905w-w95_s905w-x96-mini_s905w-x96w_s905x_s905x-b860h_s905x-nexbox-a95x_s905x-t95_s905x-tbee_s905x-tx9_s905x2_s905x2-b860h-v5_s905x2-km3_s905x2-x96max-2g_s905x2-hg680fj_s905x3-2101_s905x3-a100_s905x3-a95xf3_s905x3-a95xf3-gb_s905x3-b_s905x3-h96max_s905x3-hk1_s905x3-ip1001m_s905x3-q1"
          - "s905x3-q2_s905x3-tox1_s905x3-tx3_s905x3-tx3-bz_s905x3-ugoosx3_s905x3-whale_s905x3-x88-pro-x3_s905x3-x96air_s905x3-x96air-gb_s905x3-x96max_s912-h96pro-plus_s912-m8s-pro_s912-nexbox-a1_s912-nexbox-a2_s912-onecloudpro_s912-phicomm-t1_s912-t95z-plus_s912-tx8-max_s912-tx9-pro-2g_s912-tx9-pro-3g_s912-x92_s912-zyxq-fake_s922x_s922x-gtking"
          - "s922x-gtkingpro-h_s922x-odroid-n2_s922x-reva_s922x-ugoos-am6_seewo-sv21_seewo-sv50_smart-am40_smart-am60_station-m1_station-m2_station-p2_sv-33a6x_sv-33a6x-vpu_swan1-w28_sw799_sz3390_taram_tanix-tx6_tb-ls3399_tn3399_tpm312_tqc-a01_tvi3315a_vontar-h618"
          - "vplus_wocyber-a3_wxy-oect-mod_x88pro13_x88pro20_x98h_xiaobao_xingyicloud_youyeetoo-r1-v3_youyeetoo-yy3568_youyeetoo-yy3588_yskj_zcube1-max_zk-r39a_ztl-a568_zysj"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L --retry 3 -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz

      - name: 🔍 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 🧱 打包iStoreOS固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ matrix.GROUP }}
          openwrt_kernel: ${{ inputs.openwrt_kernel || '6.12.y' }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 调整.img.gz 文件名
        id: rename
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            echo "Processing file: $FILE"
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}/g')
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed $FILENAME to $NEW_FILENAME"
            else
              echo "No need to rename $FILENAME"
            fi
          done

      - name: 🚀 上传到 Release
        env:
          # 使用 GitHub 自动注入的内置令牌（永不过期，权限由 jobs.permissions 控制）
          # 若日后需要跨仓库操作，再改成 ${{ secrets.GH_TOKEN }} 并确保 PAT 未过期
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_PREFIX }}-$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          echo "🏷 目标标签：$TAG"

          # 令牌自检：失败立刻退出并给出明确原因，不再无效重试
          if ! gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name' >/dev/null 2>&1; then
            echo "❌ 令牌无效或权限不足，请检查 Settings → Actions → General → Workflow permissions 是否为 Read and write"
            exit 1
          fi

          # 只创建、不删除：已存在则直接复用，历史版本全部保留
          {
            echo "iStoreOS 自动编译（全机型）"
            echo ""
            echo "版本：$VERSION"
            echo "内核：${{ inputs.openwrt_kernel || '6.12.y' }}"
            echo "时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') (UTC+8)"
            echo "机型：全部 232 台（分组并行编译），资产陆续追加，请以本页最终列表为准"
          } > /tmp/notes.md

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "iStoreOS $VERSION ($(TZ=Asia/Shanghai date +%Y-%m-%d))" \
              --notes-file /tmp/notes.md || true
          fi

          # 创建结果二次确认，避免后续 upload 反复报错
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "❌ Release 创建失败，请查看上面的错误信息（常见原因：令牌无 contents:write 权限）"
            exit 1
          fi

          # 产物检查
          if ! compgen -G "${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz" > /dev/null; then
            echo "⚠️ 没有找到 .img.gz 产物，跳过上传"
            exit 0
          fi

          # 并发上传可能撞车，失败重试
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "✅ 上传完成"
              exit 0
            fi
            echo "⚠️ 第 $i 次上传失败，10 秒后重试"
            sleep 10
          done
          echo "❌ 上传多次失败"
          exit 1

  #手动触发：只编选择的机型
  build-one:
    if: github.event_name == 'workflow_dispatch' && inputs.openwrt_board != 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L --retry 3 -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz

      - name: 🔍 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 🧱 打包iStoreOS固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: ${{ inputs.kernel_usage }}
          builder_name: kwonelee

      - name: 📜 调整.img.gz 文件名
        id: rename
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            echo "Processing file: $FILE"
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}/g')
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed $FILENAME to $NEW_FILENAME"
            else
              echo "No need to rename $FILENAME"
            fi
          done

      - name: 🚀 上传到 Release
        env:
          # 使用 GitHub 自动注入的内置令牌（永不过期，权限由 jobs.permissions 控制）
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_PREFIX }}-$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          echo "🏷 目标标签：$TAG"

          if ! gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name' >/dev/null 2>&1; then
            echo "❌ 令牌无效或权限不足，请检查 Settings → Actions → General → Workflow permissions 是否为 Read and write"
            exit 1
          fi

          {
            echo "iStoreOS 手动编译"
            echo ""
            echo "版本：$VERSION"
            echo "机型：${{ inputs.openwrt_board }}"
            echo "内核：${{ inputs.openwrt_kernel }}"
            echo "底包：${{ inputs.openwrt_rootfs }}"
            echo "网络：${{ inputs.network_settings }}"
          } > /tmp/notes.md

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "iStoreOS $VERSION ($(TZ=Asia/Shanghai date +%Y-%m-%d))" \
              --notes-file /tmp/notes.md || true
          fi

          if ! compgen -G "${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz" > /dev/null; then
            echo "⚠️ 没有找到 .img.gz 产物，跳过上传"
            exit 0
          fi

          gh release upload "$TAG" ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
