# 关键：显式声明GITHUB_TOKEN权限，解决鉴权问题
permissions:
  contents: write  # 必须：创建/删除标签、Release需要的核心权限
  packages: write
  actions: read

env:
  VERSION: 24.10.4

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz
          # 验证下载是否成功
          if [ ! -f "bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz" ]; then
            echo "❌ rootfs.tar.gz 下载失败"
            exit 1
          fi

      - name: 🔍 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 🧱 打包iStoreOS固件
        uses: Kwonelee/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 调整.img.gz 文件名
        id: rename
        run: |
          # 检查打包输出目录是否存在
          if [ ! -d "${{ env.PACKAGED_OUTPUTPATH }}" ]; then
            echo "❌ 打包输出目录不存在：${{ env.PACKAGED_OUTPUTPATH }}"
            exit 1
          fi
          # 批量重命名固件文件
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            if [ -f "$FILE" ]; then
              echo "🔧 处理文件：$FILE"
              FILENAME=$(basename "$FILE")
              NEW_FILENAME=$(echo "$FILENAME" | sed "s/openwrt/istoreos_${{ env.VERSION }}/g")
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "✅ 重命名完成：$FILENAME → $NEW_FILENAME"
            else
              echo "ℹ️ 未找到.img.gz格式固件文件"
            fi
          done

      - name: 📅 设置构建日期变量
        run: |
          # 生成YYYY.MM.DD格式日期
          BUILD_DATE=$(date +'%Y.%m.%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "📅 构建日期：$BUILD_DATE"

      - name: 🗑️ 删除旧标签/旧Release（避免重复标签报错）
        run: |
          TAG_NAME="iStoreOS-${{ env.VERSION }}-SNAPSHOT-dhcp-${{ env.BUILD_DATE }}"
          # 删除远程标签（如果存在）
          git ls-remote --tags origin | grep "$TAG_NAME" && git push origin --delete "$TAG_NAME" || echo "ℹ️ 旧标签不存在，无需删除"
          # 删除旧Release（使用GitHub API）
          curl -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME" || echo "ℹ️ 旧Release不存在，无需删除"

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          # 仅保留v2.2.1支持的参数
          tag_name: iStoreOS-${{ env.VERSION }}-SNAPSHOT-dhcp-${{ env.BUILD_DATE }}
          body: |
            🔄 版本： iStoreOS-${{ env.VERSION }}-SNAPSHOT-${{ env.BUILD_DATE }}（源码编译后构建，插件集成适度精简）
            
            📱 设备型号：${{ inputs.openwrt_board }}
            
            🧱 内核版本：${{ inputs.openwrt_kernel }}（自动内核：${{ inputs.auto_kernel }}）
            
            📂 源码来源： https://github.com/istoreos/istoreos
            
            🧠 内核替换：登录iStoreOS → 系统 → Amlogic Service → Replace the Kernel
            
            👤 登录账号：root（无密码）
            
            🌐 默认IP：单网口-动态获取；多网口-192.168.100.1
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
