permissions:
  contents: write
  pull-requests: read

env:
  VERSION: 24.10.6

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ 定时构建默认参数
        run: |
          echo "DEFAULT_BOARD=s905d_s905x3_s912_s922x-ct2000" >> $GITHUB_ENV
          echo "DEFAULT_KERNEL=6.6.y" >> $GITHUB_ENV
          echo "DEFAULT_AUTO=true" >> $GITHUB_ENV

      - name: 📅 获取当前日期
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "FULL_VERSION=${{ env.VERSION }}_$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz

      - name: 🔍 查找rootfs.tar.gz
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then exit 1; fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 🧱 打包iStoreOS固件
        uses: Kwonelee/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board || env.DEFAULT_BOARD }}
          openwrt_kernel: ${{ inputs.openwrt_kernel || env.DEFAULT_KERNEL }}
          auto_kernel: ${{ inputs.auto_kernel || env.DEFAULT_AUTO }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 重命名固件（带日期版本号）
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            NEW_NAME=$(basename "$FILE" | sed "s/openwrt/istoreos_${{ env.FULL_VERSION }}/g")
            mv -f "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_NAME"
            echo "✅ 重命名为：$NEW_NAME"
          done

      - name: 🗑️ 清理旧版本标签
        run: |
          TAG="iStoreOS-${{ env.FULL_VERSION }}-SNAPSHOT-dhcp"
          git config --global user.name "Actions"
          git config --global user.email "actions@github.com"
          git push origin --delete "$TAG" || true
          curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" || true

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.FULL_VERSION }}-SNAPSHOT-dhcp
          body: |
            🔄 版本：iStoreOS ${{ env.FULL_VERSION }}（每日自动构建）
            📅 构建日期：${{ env.BUILD_DATE }}
            📦 设备：${{ inputs.openwrt_board || env.DEFAULT_BOARD }}
            🧩 内核：${{ inputs.openwrt_kernel || env.DEFAULT_KERNEL }}
            🔐 账号：root（无密码）
            🌐 IP：单网口DHCP自动获取｜多网口：192.168.100.1
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
